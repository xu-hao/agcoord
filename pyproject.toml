[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "agcoord"
dynamic = ["version"]
description = "Machine-local gate and publication coordinator for development agents"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
dependencies = ["textual>=8.2,<9"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Environment :: Console",
  "Framework :: Pytest",
  "Intended Audience :: Developers",
  "Operating System :: POSIX :: Linux",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Software Development :: Build Tools",
  "Typing :: Typed",
]

[project.optional-dependencies]
test = [
  "build>=1.2",
  "pytest>=8",
  "pytest-asyncio>=0.24",
  "pytest-xdist>=3.8",
  "twine>=5",
]
xdist = ["pytest-xdist>=3.8"]

[project.scripts]
agc = "agcoord.cli:main"

[project.entry-points.pytest11]
agcoord-xdist = "agcoord.pytest_xdist"

[project.urls]
Homepage = "https://github.com/xu-hao/agcoord"
Changelog = "https://github.com/xu-hao/agcoord/blob/main/CHANGELOG.md"
Documentation = "https://github.com/xu-hao/agcoord/tree/main/docs"
Issues = "https://github.com/xu-hao/agcoord/issues"
Repository = "https://github.com/xu-hao/agcoord"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
agcoord = ["py.typed", "native_host_pin.json"]

[tool.setuptools.dynamic]
version = {attr = "agcoord.__version__"}

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "strict"

[package]
name = "agcoord-broker"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "Single-executable native scheduler and enforcement owner for AGCoord"
build = "build.rs"
publish = false

[dependencies]
libc = "=0.2.189"
rusqlite = { version = "=0.40.2", default-features = false, features = ["bundled"] }
serde = { version = "=1.0.229", default-features = false }
serde_json = "=1.0.151"
signal-hook = { version = "=0.4.4", default-features = false }

[[bin]]
name = "agcoord-broker"
path = "src/main.rs"

[lints.rust]
unsafe_op_in_unsafe_fn = "deny"

name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e '.[test]'
      - run: python -m pytest

  artifacts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install build twine
      - run: python -m build
      - run: python -m twine check dist/*
      - run: python -m venv /tmp/agcoord-wheel
      - run: /tmp/agcoord-wheel/bin/pip install dist/*.whl
      - run: /tmp/agcoord-wheel/bin/python -c "import agcoord"
      - run: /tmp/agcoord-wheel/bin/agcoord --help
      - run: python -m venv /tmp/agcoord-sdist
      - run: /tmp/agcoord-sdist/bin/pip install dist/*.tar.gz
      - run: /tmp/agcoord-sdist/bin/python -m agcoord --help

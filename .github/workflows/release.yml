name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install build twine
      - name: Verify tag matches package version
        shell: bash
        run: test "${GITHUB_REF_NAME#v}" = "$(PYTHONPATH=src python -c 'from agcoord import __version__; print(__version__)')"
      - run: python -m build
      - run: python -m twine check dist/*
      - run: python -m venv /tmp/agcoord-wheel
      - run: /tmp/agcoord-wheel/bin/pip install dist/*.whl
      - run: /tmp/agcoord-wheel/bin/python -c "import agcoord"
      - run: test "$(/tmp/agcoord-wheel/bin/agcoord --version)" = "agcoord ${GITHUB_REF_NAME#v}"
      - run: /tmp/agcoord-wheel/bin/agcoord --help
      - run: python -m venv /tmp/agcoord-sdist
      - run: /tmp/agcoord-sdist/bin/pip install dist/*.tar.gz
      - run: test "$(/tmp/agcoord-sdist/bin/python -m agcoord --version)" = "agcoord ${GITHUB_REF_NAME#v}"
      - run: /tmp/agcoord-sdist/bin/python -m agcoord --help
      - uses: actions/upload-artifact@v4
        with:
          name: python-package-distributions
          path: dist/

name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  native-broker:
    name: native-broker (x86_64-unknown-linux-musl)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install -e '.[test]'
      - name: Install static-link audit prerequisites
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends apparmor musl-tools
      - name: Install pinned Rust toolchain
        run: rustup toolchain install 1.94.1 --profile minimal --component clippy,rustfmt --target x86_64-unknown-linux-musl
      - run: cargo fetch --locked
      - run: cargo fmt --all --check
      - run: cargo clippy --frozen --workspace --all-targets -- -D warnings
      - name: Run versioned Python/native conformance gate
        run: ./scripts/check-conformance
      - run: ./scripts/build-native-broker
      - run: ./scripts/audit-native-broker dist/native/agcoord-broker-x86_64-unknown-linux-musl
      - run: ./scripts/check-native-licenses dist/native/agcoord-broker-x86_64-unknown-linux-musl
      - run: ./scripts/check-native-reproducible
      - run: ./scripts/build-native-host-package dist/native/agcoord-broker-x86_64-unknown-linux-musl
      - uses: actions/upload-artifact@v4
        with:
          name: agcoord-native-host-x86_64-linux
          if-no-files-found: error
          path: |
            dist/native/*
            dist/host/*

  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install build twine
      - name: Verify tag matches package version
        shell: bash
        run: test "${GITHUB_REF_NAME#v}" = "$(PYTHONPATH=src python -c 'from agcoord import __version__; print(__version__)')"
      - name: Build Python distributions with fixed modes
        run: |
          umask 022
          python -m build --outdir dist/python
      - run: python -m twine check dist/python/*
      - uses: actions/upload-artifact@v4
        with:
          name: python-package-distributions
          if-no-files-found: error
          path: dist/python/*

  release-candidate:
    needs: [native-broker, verify]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install twine
      - name: Install artifact audit prerequisites
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends apparmor binutils file
      - uses: actions/download-artifact@v4
        with:
          name: agcoord-native-host-x86_64-linux
          path: dist/input/native-host
      - uses: actions/download-artifact@v4
        with:
          name: python-package-distributions
          path: dist/input/python
      - name: Restore declared executable modes after artifact transport
        run: |
          chmod 0755 \
            dist/input/native-host/native/agcoord-broker-x86_64-unknown-linux-musl \
            dist/input/native-host/host/check-native-host-package \
            dist/input/native-host/host/install-native-host \
            dist/input/native-host/host/test-native-host-enforcement
      - name: Verify tagged clean installs and assemble release bundle
        run: |
          ./scripts/verify-release-candidate \
            --tag "$GITHUB_REF_NAME" \
            --python-dir dist/input/python \
            --native-dir dist/input/native-host/native \
            --host-dir dist/input/native-host/host \
            --output-dir dist/release
      - uses: actions/upload-artifact@v4
        with:
          name: agcoord-release-${{ github.ref_name }}
          if-no-files-found: error
          path: dist/release/*
